<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  
  <!-- PWA Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="HardwareOS">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="manifest" href="manifest.json">
  
  <!-- SEO & Description -->
  <title>HardwareOS - Inventory & Operations Management</title>
  <meta name="description" content="Modern multi-tenant SaaS for hardware stores, construction suppliers, and warehouses in the Philippines">
  <meta name="theme-color" content="#FF6B35">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- Flutter Web Loader -->
  <script src="flutter_bootstrap.js" async></script>
  
  <!-- Service Worker for Offline Support -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('flutter_service_worker.js');
      });
    }
  </script>
  
  <!-- Loading Indicator -->
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #1a202c;
    }
    
    .loading-container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
      background: linear-gradient(135deg, #1a202c 0%, #2d3748 100%);
    }
    
    .loading-spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(255, 107, 53, 0.2);
      border-top: 4px solid #FF6B35;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .loading-text {
      color: #ffffff;
      margin-top: 20px;
      font-size: 16px;
      font-weight: 500;
    }
    
    .loading-subtext {
      color: #a0aec0;
      margin-top: 8px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <!-- Loading Screen (shown while Flutter loads) -->
  <div class="loading-container" id="loading">
    <div class="loading-spinner"></div>
    <div class="loading-text">Loading HardwareOS</div>
    <div class="loading-subtext">Initializing application...</div>
  </div>
  
  <!-- Hide loading when Flutter is ready -->
  <script>
    window.addEventListener('flutter-ready', function() {
      document.getElementById('loading').style.display = 'none';
    });
  </script>
</body>
</html>
