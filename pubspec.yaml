name: hardwareos
description: "Multi-tenant SaaS for Hardware Stores"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  supabase_flutter: ^2.3.4
  drift: ^2.15.0
  sqlite3_flutter_libs: ^0.5.18
  envied: ^0.5.3
  go_router: ^13.1.0
  equatable: ^2.0.5
  intl: ^0.19.0
  uuid: ^4.3.3
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.9
  envied_generator: ^0.5.3
  drift_dev: ^2.15.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - .env
